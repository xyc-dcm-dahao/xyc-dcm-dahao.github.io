                answer: "C",
                analysis: "弱人工智能专注单一领域任务，如语音识别、图像识别，是当前主流AI形态。"

        ];

        // 全局变量
        let currentIndex = 0;
        let selectedOption = null;
        let answeredCount = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let wrongList = [];

        // DOM元素
        const currentNumEl = document.getElementById('current-num');
        const answeredEl = document.getElementById('answered');
        const correctEl = document.getElementById('correct');
        const wrongEl = document.getElementById('wrong');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const resultEl = document.getElementById('result');
        const analysisEl = document.getElementById('analysis');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const wrongBtn = document.getElementById('wrong-btn');
        const wrongListEl = document.getElementById('wrong-list');
        const wrongItemsEl = document.getElementById('wrong-items');

        // 初始化显示题目
        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.q;
            optionsEl.innerHTML = '';
            selectedOption = null;
            resultEl.style.display = 'none';
            analysisEl.style.display = 'none';
            submitBtn.disabled = false;
            nextBtn.disabled = true;

            q.options.forEach(option => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option;
                div.onclick = () => {
                    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedOption = option.charAt(0);
                };
                optionsEl.appendChild(div);
            });
        }

        // 提交答案
        submitBtn.onclick = () => {
            if (!selectedOption) {
                alert('请选择一个选项！');
                return;
            }

            const q = questions[currentIndex];
            const isCorrect = selectedOption === q.answer;
            submitBtn.disabled = true;
            nextBtn.disabled = false;
            answeredCount++;

            if (isCorrect) {
                correctCount++;
                resultEl.textContent = '✅ 回答正确！';
                resultEl.className = 'result correct';
            } else {
                wrongCount++;
                resultEl.textContent = `❌ 回答错误！正确答案：${q.answer}`;
                resultEl.className = 'result wrong';
                // 记录错题
                wrongList.push({
                    q: q.q,
                    userAns: selectedOption,
                    correctAns: q.answer,
                    analysis: q.analysis
                });
            }

            resultEl.style.display = 'block';
            analysisEl.textContent = `解析：${q.analysis}`;
            analysisEl.style.display = 'block';
            updateStats();
        };

        // 下一题
        nextBtn.onclick = () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                currentNumEl.textContent = currentIndex + 1;
                renderQuestion();
            } else {
                alert('🎉 已完成全部100道题目！');
            }
        };

        // 查看错题
        wrongBtn.onclick = () => {
            if (wrongList.length === 0) {
                alert('暂无错题！');
                return;
            }
            wrongItemsEl.innerHTML = '';
            wrongList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `
                    <div class="wrong-q">${item.q}</div>
                    <div>你的答案：<span class="wrong-ans">${item.userAns}</span></div>
                    <div>正确答案：<span class="wrong-correct">${item.correctAns}</span></div>
                    <div>解析：${item.analysis}</div>
                `;
                wrongItemsEl.appendChild(div);
            });
            wrongListEl.style.display = 'block';
        };

        // 更新统计
        function updateStats() {
            answeredEl.textContent = answeredCount;
            correctEl.textContent = correctCount;
            wrongEl.textContent = wrongCount;
        }

        // 启动
        renderQuestion();
    </script>

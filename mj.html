<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>慢脚 - 记录美好生活</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --pink: #FE2C55;
            --pink-light: #FF6B8A;
            --bg-dark: #000000;
            --text-white: #FFFFFF;
            --text-gray: rgba(255, 255, 255, 0.7);
            --text-dim: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* ========== 启动页 ========== */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .splash-screen.hide {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .splash-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--pink), var(--pink-light));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: splashPulse 1.5s ease-in-out infinite;
            box-shadow: 0 10px 40px rgba(254, 44, 85, 0.4);
            overflow: hidden;
        }

        .splash-logo svg {
            width: 70%;
            height: 70%;
        }

        @keyframes splashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .splash-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--pink), var(--pink-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .splash-subtitle {
            font-size: 14px;
            color: var(--text-gray);
            letter-spacing: 4px;
        }

        .splash-loader {
            margin-top: 40px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 主容器 ========== */
        .app-container {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* ========== 视频滑动区域 ========== */
        .video-feed {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .video-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* 视频加载占位 */
        .video-placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: opacity 0.5s ease;
        }

        .video-placeholder.loaded {
            opacity: 0;
            pointer-events: none;
        }

        .video-placeholder .loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        .video-placeholder span {
            font-size: 13px;
            color: var(--text-dim);
        }

        /* ========== 顶部导航 ========== */
        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
        }

        .top-nav .live-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-nav .live-btn svg {
            width: 100%;
            height: 100%;
        }

        .top-nav .tab-switch {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: -60px;
        }

        .top-nav .tab-switch .tab-item {
            font-size: 16px;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px 0;
            position: relative;
            transition: color 0.3s;
            background: none;
            border: none;
            font-family: inherit;
        }

        .top-nav .tab-switch .tab-item.active {
            color: white;
            font-weight: 700;
            font-size: 17px;
        }

        .top-nav .tab-switch .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--text-white);
            border-radius: 2px;
        }

        .top-nav .search-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            opacity: 0.9;
        }

        .top-nav .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-left: 2px;
            margin-right: auto;
            cursor: pointer;
            user-select: none;
            background: linear-gradient(90deg, #fff, #ffe4e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ========== 右侧操作栏 ========== */
        .action-bar {
            position: absolute;
            right: 10px;
            bottom: 160px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .action-item .icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .action-item:active .icon-wrap {
            transform: scale(0.85);
        }

        .action-item .count {
            font-size: 11px;
            color: var(--text-white);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* 头像 */
        .avatar-wrap {
            position: relative;
            margin-bottom: 6px;
        }

        .avatar-wrap .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            background: #333;
        }

        .avatar-wrap .follow-badge {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: var(--pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: 2px solid #000;
            cursor: pointer;
        }

        .avatar-wrap .follow-badge.followed {
            background: #333;
            font-size: 10px;
        }

        /* 点赞动画 */
        .action-item .icon-wrap.liked {
            animation: likeAnim 0.4s ease;
        }

        @keyframes likeAnim {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* 音乐唱片 */
        .music-disc {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #333;
            border: 8px solid #222;
            animation: discSpin 4s linear infinite;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-disc img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .music-disc.paused {
            animation-play-state: paused;
        }

        @keyframes discSpin {
            to { transform: rotate(360deg); }
        }

        /* ========== 底部信息区 ========== */
        .video-info {
            position: absolute;
            left: 12px;
            right: 70px;
            bottom: 90px;
            z-index: 100;
        }

        .video-info .username {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-info .username .tag {
            background: var(--pink);
            color: white;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 500;
        }

        .video-info .desc {
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-info .music-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        .video-info .music-info .music-icon {
            font-size: 14px;
        }

        .video-info .music-info .music-name {
            white-space: nowrap;
            overflow: hidden;
            max-width: 200px;
        }

        .video-info .music-info .music-name span {
            display: inline-block;
            animation: marquee 8s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ========== 底部导航栏 ========== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            height: 70px;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            background: rgba(0, 0, 0, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 6px 12px;
            transition: opacity 0.2s;
        }

        .nav-item:active {
            opacity: 0.6;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            height: 26px;
            display: flex;
            align-items: center;
        }

        .nav-item .nav-label {
            font-size: 10px;
            color: var(--text-dim);
        }

        .nav-item.active .nav-label {
            color: white;
        }

        /* 中间发布按钮 */
        .nav-publish {
            width: 44px;
            height: 30px;
            background: linear-gradient(90deg, #25F4EE, var(--pink));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .nav-publish::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 30px;
            background: white;
            border-radius: 6px;
        }

        .nav-publish::after {
            content: '+';
            position: relative;
            z-index: 1;
            font-size: 22px;
            font-weight: 300;
            color: black;
            margin-top: -1px;
        }

        /* ========== 双击点赞特效 ========== */
        .double-tap-heart {
            position: absolute;
            z-index: 150;
            pointer-events: none;
            animation: heartFloat 1s ease forwards;
        }

        .double-tap-heart svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 2px 8px rgba(254, 44, 85, 0.5));
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: scale(0) rotate(-15deg);
            }
            15% {
                opacity: 1;
                transform: scale(1.2) rotate(10deg);
            }
            30% {
                transform: scale(0.95) rotate(-5deg);
            }
            45% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            80% {
                opacity: 1;
                transform: scale(1) translateY(-20px);
            }
            100% {
                opacity: 0;
                transform: scale(1.1) translateY(-60px);
            }
        }

        /* ========== 评论面板 ========== */
        .comment-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .comment-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .comment-panel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            height: 60vh;
            background: #1e1e1e;
            border-radius: 16px 16px 0 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
        }

        .comment-overlay.show .comment-panel {
            transform: translateX(-50%) translateY(0);
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .comment-header h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .comment-header .close-btn {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 20px;
            cursor: pointer;
        }

        .comment-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .comment-list::-webkit-scrollbar {
            width: 0;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .comment-item .c-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            overflow: hidden;
        }

        .comment-item .c-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-item .c-body {
            flex: 1;
        }

        .comment-item .c-name {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .comment-item .c-text {
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
        }

        .comment-item .c-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .comment-item .c-like {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .comment-input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: #1e1e1e;
        }

        .comment-input-bar input {
            flex: 1;
            height: 36px;
            background: #333;
            border: none;
            border-radius: 18px;
            padding: 0 14px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .comment-input-bar input::placeholder {
            color: var(--text-dim);
        }

        .comment-input-bar .send-btn {
            background: var(--pink);
            border: none;
            color: white;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 500;
        }

        /* ========== 分享面板 ========== */
        .share-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .share-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .share-panel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            border-radius: 16px 16px 0 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 20px 16px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .share-overlay.show .share-panel {
            transform: translateX(-50%) translateY(0);
        }

        .share-title {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .share-grid {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .share-grid::-webkit-scrollbar {
            display: none;
        }

        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 64px;
            cursor: pointer;
        }

        .share-item .s-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .share-item .s-label {
            font-size: 11px;
            color: var(--text-gray);
        }

        .share-cancel {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: #333;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        /* ========== 暂停/播放指示 ========== */
        .play-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 120;
            pointer-events: none;
            opacity: 0;
            transition: none;
        }

        .play-indicator.show {
            animation: playPop 0.6s ease forwards;
        }

        @keyframes playPop {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }

        .play-indicator svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.5));
        }

        /* ========== 进度条 ========== */
        .progress-bar {
            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 100;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            width: 0%;
            transition: width 0.3s linear;
        }

        /* ========== 搜索页 ========== */
        .search-page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            z-index: 300;
            transform: translateY(-100%);
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
        }

        .search-page.show {
            transform: translateY(0);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .search-bar .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .search-bar input {
            flex: 1;
            height: 36px;
            background: #333;
            border: none;
            border-radius: 18px;
            padding: 0 14px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-dim);
        }

        .search-trending {
            padding: 16px;
        }

        .search-trending h4 {
            font-size: 14px;
            margin-bottom: 14px;
            color: var(--text-gray);
        }

        .trending-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .trending-tag {
            padding: 6px 14px;
            background: #2a2a2a;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-gray);
            cursor: pointer;
            transition: background 0.2s;
        }

        .trending-tag:hover {
            background: #3a3a3a;
        }

        /* ========== Toast提示 ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);

        // ========== 创建视频幻灯片 ==========
        function createVideoSlides() {
            const feed = document.getElementById('videoFeed');
            feed.innerHTML = '';

            videoData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'video-slide';
                slide.style.transform = index === 0 ? 'translateY(0)' : `translateY(${index * 100}%)`;

                slide.innerHTML = `
                    <div class="video-placeholder" id="placeholder-${index}">
                        <div class="loader"></div>
                        <span>加载中...</span>
                    </div>
                    <video
                        id="video-${index}"
                        src="${data.url}"
                        loop
                        playsinline
                        webkit-playsinline
                        preload="auto"
                        poster="${data.poster}"
                        style="width:100%;height:100%;object-fit:cover;background:#000;"
                    ></video>
                `;

                feed.appendChild(slide);

                const video = slide.querySelector('video');
                video.addEventListener('loadeddata', () => {
                    const placeholder = document.getElementById(`placeholder-${index}`);
                    if (placeholder) placeholder.classList.add('loaded');
                });

                video.addEventListener('waiting', () => {
                    const placeholder = document.getElementById(`placeholder-${index}`);
                    if (placeholder) placeholder.classList.remove('loaded');
                });

                video.addEventListener('canplay', () => {
                    const placeholder = document.getElementById(`placeholder-${index}`);
                    if (placeholder) placeholder.classList.add('loaded');
                });

                videos.push(video);
            });

                touchStartY = e.touches[0].clientY;
                touchMoveY = 0;
                isSwiping = false;
            }, { passive: true });

            feed.addEventListener('touchmove', (e) => {
                touchMoveY = e.touches[0].clientY;
                const diff = touchMoveY - touchStartY;
                if (Math.abs(diff) > 10) {
                    isSwiping = true;
                }
            }, { passive: true });

            feed.addEventListener('touchend', handleSwipeEnd);

            // 鼠标事件（桌面端）
            feed.addEventListener('mousedown', (e) => {
                touchStartY = e.clientY;
                touchMoveY = 0;
                isSwiping = false;
            });

            feed.addEventListener('mousemove', (e) => {
                if (e.buttons === 1) {
                    touchMoveY = e.clientY;
                    const diff = touchMoveY - touchStartY;
                    if (Math.abs(diff) > 10) {
                        isSwiping = true;
                    }
                }
            });

            feed.addEventListener('mouseup', (e) => {
                touchMoveY = e.clientY;
                handleSwipeEnd();
            });

            // 滚轮切换
            let wheelTimeout = null;
            feed.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (wheelTimeout) return;
                wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 600);

                if (e.deltaY > 30) {
                    switchVideo(1);
                } else if (e.deltaY < -30) {
                    switchVideo(-1);
                }
            }, { passive: false });

            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') switchVideo(1);
                if (e.key === 'ArrowUp') switchVideo(-1);
                if (e.key === ' ') { e.preventDefault(); togglePlay(); }
            });
        }

        function handleSwipeEnd() {
            const diff = touchMoveY - touchStartY;
            const now = Date.now();

            // 双击检测
            if (!isSwiping && Math.abs(diff) < 10) {
                if (now - lastTapTime < 300) {
                    handleDoubleTap();
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;

                // 单击暂停/播放
                setTimeout(() => {
                    if (lastTapTime !== 0 && Date.now() - lastTapTime >= 280) {
                        togglePlay();
                        lastTapTime = 0;
                    }
                }, 300);
                return;
            }

            if (isSwiping) {
                if (diff < -60) {
                    switchVideo(1);
                } else if (diff > 60) {
                    switchVideo(-1);
                }
            }
        }

        // ========== 视频切换 ==========
        function switchVideo(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= videoData.length) {
                if (newIndex >= videoData.length) {
                    showToast('没有更多视频了～');
                }
                return;
            }

            // 暂停当前视频
            if (videos[currentIndex]) {
                videos[currentIndex].pause();
            }

            currentIndex = newIndex;

            // 更新所有幻灯片位置
            const slides = document.querySelectorAll('.video-slide');
            slides.forEach((slide, i) => {
                slide.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                slide.style.transform = `translateY(${(i - currentIndex) * 100}%)`;
            });

            // 更新信息
            updateVideoInfo(currentIndex);
            resetLikeState();
            resetFollowState();
            loadComments();

            // 播放新视频
            setTimeout(() => playVideo(currentIndex), 300);
        }

        // ========== 播放控制 ==========
        function playVideo(index) {
            if (videos[index]) {
                videos[index].play().catch(() => {});
                isPaused = false;
                updatePlayIndicator();
                startProgress();
            }
        }

        function togglePlay() {
            const video = videos[currentIndex];
            if (!video) return;

            if (isPaused) {
                video.play().catch(() => {});
                isPaused = false;
            } else {
                video.pause();
                isPaused = true;
            }
            updatePlayIndicator();
        }

        function updatePlayIndicator() {
            const indicator = document.getElementById('playIndicator');
            const path = document.getElementById('playIconPath');
            const disc = document.getElementById('musicDisc');

            if (isPaused) {
                path.setAttribute('d', 'M20 16 L20 48 L48 32 Z');
                disc.classList.add('paused');
            } else {
                path.setAttribute('d', 'M24 16 L48 32 L24 48 Z');
                disc.classList.remove('paused');
            }

            indicator.classList.remove('show');
            void indicator.offsetWidth;
            indicator.classList.add('show');
        }

        // ========== 进度条 ==========
        function startProgress() {
            if (progressTimer) cancelAnimationFrame(progressTimer);

            function update() {
                const video = videos[currentIndex];
                if (video && video.duration) {
                    const progress = (video.currentTime / video.duration) * 100;
                    document.getElementById('progressFill').style.width = progress + '%';
                }
                progressTimer = requestAnimationFrame(update);
            }
            progressTimer = requestAnimationFrame(update);
        }

        // ========== 更新视频信息 ==========
        function updateVideoInfo(index) {
            const data = videoData[index];
            document.getElementById('infoUsername').textContent = '@' + data.user;
            document.getElementById('infoDesc').textContent = data.desc;
            document.getElementById('infoMusic').textContent = data.music + '\u00a0\u00a0\u00a0\u00a0' + data.music + '\u00a0\u00a0\u00a0\u00a0';
            document.getElementById('likeCount').textContent = data.likes;
            document.getElementById('commentCount').textContent = data.comments;
            document.getElementById('avatarImg').src = data.avatar;

            const tagEl = document.querySelector('.video-info .tag');
            tagEl.textContent = data.tag;
        }

        // ========== 点赞 ==========
        function toggleLike() {
            isLiked = !isLiked;
            const icon = document.getElementById('likeIcon');
            const count = document.getElementById('likeCount');

            if (isLiked) {
                icon.textContent = '❤️';
                icon.classList.add('liked');
                const num = parseFloat(count.textContent);
                count.textContent = (num + 0.1).toFixed(1) + 'w';
            } else {
                icon.textContent = '🤍';
                icon.classList.remove('liked');
                const data = videoData[currentIndex];
                count.textContent = data.likes;
            }
        }

        function resetLikeState() {
            isLiked = false;
            const icon = document.getElementById('likeIcon');
            icon.textContent = '🤍';
            icon.classList.remove('liked');
        }

        // ========== 双击点赞 ==========
        function handleDoubleTap() {
            if (!isLiked) toggleLike();

            // 创建爱心特效
            const heart = document.createElement('div');
            heart.className = 'double-tap-heart';
            heart.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 88 C25 65 5 50 5 30 C5 15 15 5 30 5 C40 5 47 10 50 18 C53 10 60 5 70 5 C85 5 95 15 95 30 C95 50 75 65 50 88Z" fill="#FE2C55"/></svg>`;

            const feed = document.getElementById('videoFeed');
            heart.style.left = 'calc(50% - 40px)';
            heart.style.top = 'calc(50% - 40px)';
            feed.appendChild(heart);

            setTimeout(() => heart.remove(), 1000);
        }

        // ========== 关注 ==========
        function toggleFollow() {
            isFollowed = !isFollowed;
            const badge = document.getElementById('followBadge');

            if (isFollowed) {
                badge.textContent = '✓';
                badge.classList.add('followed');
                showToast('关注成功');
            } else {
                badge.textContent = '+';
                badge.classList.remove('followed');
                showToast('已取消关注');
            }
        }

        function resetFollowState() {
            isFollowed = false;
            const badge = document.getElementById('followBadge');
            badge.textContent = '+';
            badge.classList.remove('followed');
        }

        // ========== 评论 ==========
        function openComments() {
            document.getElementById('commentOverlay').classList.add('show');
            loadComments();
        }

        function closeComments(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('commentOverlay').classList.remove('show');
        }

        function loadComments() {
            const list = document.getElementById('commentList');
            const data = videoData[currentIndex];
            document.getElementById('commentTitle').textContent = data.comments + ' 条评论';

            list.innerHTML = commentsData.map(c => `
                <div class="comment-item">
                    <div class="c-avatar">${c.avatar}</div>
                    <div class="c-body">
                        <div class="c-name">${c.name}</div>
                        <div class="c-text">${c.text}</div>
                        <div class="c-meta">
                            <span>${c.time}</span>
                            <span class="c-like" onclick="this.querySelector('span').textContent = parseInt(this.querySelector('span').textContent) + 1">🤍 <span>${c.likes}</span></span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function sendComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const list = document.getElementById('commentList');
            const newComment = document.createElement('div');
            newComment.className = 'comment-item';
            newComment.innerHTML = `
                <div class="c-avatar">😎</div>
                <div class="c-body">
                    <div class="c-name">我</div>
                    <div class="c-text">${escapeHtml(text)}</div>
                    <div class="c-meta">
                        <span>刚刚</span>
                        <span class="c-like">🤍 <span>0</span></span>
                    </div>
                </div>
            `;
            list.insertBefore(newComment, list.firstChild);
            input.value = '';
            showToast('评论成功');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 分享 ==========
        function openShare() {
            document.getElementById('shareOverlay').classList.add('show');
        }

        function closeShare(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('shareOverlay').classList.remove('show');
        }

        // ========== 搜索 ==========
        function toggleSearch() {
            document.getElementById('searchPage').classList.toggle('show');
        }

        // ========== Tab切换 ==========
        function switchTab(el, name) {
            document.querySelectorAll('.tab-switch .tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if (name === '关注') {
                showToast('关注页面开发中');
            }
        }

        // ========== Toast ==========
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ========== 开发者模式 ==========
        function handleBrandClick() {
            brandClickCount++;

            // 重置计时器
            if (brandClickTimer) clearTimeout(brandClickTimer);
            brandClickTimer = setTimeout(() => {
                brandClickCount = 0;
            }, 3000);

            if (brandClickCount >= 10) {
                brandClickCount = 0;
                clearTimeout(brandClickTimer);
                enterDevMode();
            }
        }

        function enterDevMode() {
            // 创建密码输入对话框
            const modal = document.createElement('div');
            modal.id = 'devPasswordModal';
            modal.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.85);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            modal.innerHTML = `
                <div style="
                    background: #1e1e1e;
                    padding: 24px;
                    border-radius: 16px;
                    width: 280px;
                    text-align: center;
                ">
                    <h3 style="margin-bottom: 16px; font-size: 16px;">🔐 开发者模式</h3>
                    <p style="font-size: 13px; color: #888; margin-bottom: 12px;">请输入密码</p>
                    <input type="password" id="devPasswordInput" placeholder="密码" style="
                        width: 100%;
                        height: 40px;
                        background: #333;
                        border: none;
                        border-radius: 8px;
                        padding: 0 12px;
                        color: white;
                        font-size: 14px;
                        margin-bottom: 16px;
                        outline: none;
                    ">
                    <div style="display: flex; gap: 10px;">
                        <button onclick="checkDevPassword()" style="
                            flex: 1;
                            height: 36px;
                            background: var(--pink);
                            border: none;
                            border-radius: 8px;
                            color: white;
                            font-size: 14px;
                            cursor: pointer;
                        ">确认</button>
                        <button onclick="closeDevModal()" style="
                            flex: 1;
                            height: 36px;
                            background: #444;
                            border: none;
                            border-radius: 8px;
                            color: white;
                            font-size: 14px;
                            cursor: pointer;
                        ">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            // 自动聚焦
            setTimeout(() => document.getElementById('devPasswordInput').focus(), 100);

            // 回车确认
            document.getElementById('devPasswordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkDevPassword();
            });
        }

        function closeDevModal() {
            const modal = document.getElementById('devPasswordModal');
            if (modal) modal.remove();
        }

        function checkDevPassword() {
            const input = document.getElementById('devPasswordInput').value;
            if (input === 'a1d2m3i4n5') {
                isDevMode = true;
                closeDevModal();
                showDevMenu();
                showToast('✅ 开发者模式已开启');
            } else {
                showToast('❌ 密码错误');
                document.getElementById('devPasswordInput').value = '';
            }
        }

        function showDevMenu() {
            // 添加开发者菜单按钮到顶部导航
            const topNav = document.querySelector('.top-nav');
            if (document.getElementById('devMenuBtn')) return;

            const devBtn = document.createElement('button');
            devBtn.id = 'devMenuBtn';
            devBtn.textContent = '🛠️';
            devBtn.style.cssText = `
                background: none;
                border: none;
                font-size: 18px;
                cursor: pointer;
                margin-left: 8px;
            `;
            devBtn.onclick = toggleDevPanel;
            topNav.appendChild(devBtn);

            // 创建开发者面板
            const panel = document.createElement('div');
            panel.id = 'devPanel';
            panel.style.cssText = `
                position: fixed;
                top: 60px;
                right: 10px;
                width: 200px;
                background: #1e1e1e;
                border-radius: 12px;
                padding: 12px;
                z-index: 5000;
                display: none;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            `;
            panel.innerHTML = `
                <h4 style="font-size: 14px; margin-bottom: 12px; color: #FE2C55;">开发者工具</h4>
                <button onclick="openUploadVideo()" style="
                    width: 100%;
                    padding: 10px;
                    background: linear-gradient(90deg, #FE2C55, #FF6B8A);
                    border: none;
                    border-radius: 8px;
                    color: white;
                    font-size: 13px;
                    cursor: pointer;
                    margin-bottom: 8px;
                ">📤 发布视频</button>
                <button onclick="showToast('调试信息')" style="
                    width: 100%;
                    padding: 10px;
                    background: #333;
                    border: none;
                    border-radius: 8px;
                    color: white;
                    font-size: 13px;
                    cursor: pointer;
                    margin-bottom: 8px;
                ">📊 调试信息</button>
                <button onclick="exitDevMode()" style="
                    width: 100%;
                    padding: 10px;
                    background: #444;
                    border: none;
                    border-radius: 8px;
                    color: white;
                    font-size: 13px;
                    cursor: pointer;
                ">退出开发者模式</button>
            `;
            document.body.appendChild(panel);
        }

        function toggleDevPanel() {
            const panel = document.getElementById('devPanel');
            if (panel) {
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            }
        }

        function exitDevMode() {
            isDevMode = false;
            const devBtn = document.getElementById('devMenuBtn');
            const panel = document.getElementById('devPanel');
            if (devBtn) devBtn.remove();
            if (panel) panel.remove();
            showToast('已退出开发者模式');
        }

        // ========== 发布视频功能 ==========
        function openUploadVideo() {
            const modal = document.createElement('div');
            modal.id = 'uploadModal';
            modal.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.9);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            modal.innerHTML = `
                <div style="
                    background: #1e1e1e;
                    width: 90%;
                    max-width: 400px;
                    border-radius: 16px;
                    padding: 24px;
                ">
                    <h3 style="margin-bottom: 20px; font-size: 18px;">📤 发布视频</h3>

                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 13px; color: #888; margin-bottom: 6px;">视频URL</label>
                        <input type="text" id="uploadVideoUrl" placeholder="https://example.com/video.mp4" style="
                            width: 100%;
                            height: 40px;
                            background: #333;
                            border: none;
                            border-radius: 8px;
                            padding: 0 12px;
                            color: white;
                            font-size: 14px;
                            outline: none;
                        ">
                    </div>

                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 13px; color: #888; margin-bottom: 6px;">描述</label>
                        <textarea id="uploadVideoDesc" placeholder="添加视频描述..." style="
                            width: 100%;
                            height: 80px;
                            background: #333;
                            border: none;
                            border-radius: 8px;
                            padding: 10px 12px;
                            color: white;
                            font-size: 14px;
                            outline: none;
                            resize: none;
                            font-family: inherit;
                        "></textarea>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 13px; color: #888; margin-bottom: 6px;">用户名</label>
                        <input type="text" id="uploadVideoUser" value="开发者" style="
                            width: 100%;
                            height: 40px;
                            background: #333;
                            border: none;
                            border-radius: 8px;
                            padding: 0 12px;
                            color: white;
                            font-size: 14px;
                            outline: none;
                        ">
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button onclick="submitVideo()" style="
                            flex: 1;
                            height: 44px;
                            background: linear-gradient(90deg, #FE2C55, #FF6B8A);
                            border: none;
                            border-radius: 8px;
                            color: white;
                            font-size: 15px;
                            font-weight: 600;
                            cursor: pointer;
                        ">发布</button>
                        <button onclick="closeUploadModal()" style="
                            flex: 1;
                            height: 44px;
                            background: #444;
                            border: none;
                            border-radius: 8px;
                            color: white;
                            font-size: 15px;
                            cursor: pointer;
                        ">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('uploadVideoUrl').focus();
        }

        function closeUploadModal() {
            const modal = document.getElementById('uploadModal');
            if (modal) modal.remove();
        }

        function submitVideo() {
            const url = document.getElementById('uploadVideoUrl').value.trim();
            const desc = document.getElementById('uploadVideoDesc').value.trim();
            const user = document.getElementById('uploadVideoUser').value.trim() || '开发者';

            if (!url) {
                showToast('请输入视频URL');
                return;
            }

            // 添加新视频到列表
            const newVideo = {
                url: url,
                poster: '',
                user: user,
                avatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23FE2C55%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2262%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22%3E🐢%3C/text%3E%3C/svg%3E',
                desc: desc || '分享我的视频 🎬 #慢脚',
                music: '原声 - ' + user,
                likes: '0',
                comments: '0',
                shares: '0',
                tag: '新发布'
            };

            videoData.unshift(newVideo);
            closeUploadModal();

            // 重新创建视频列表
            createVideoSlides();
            videos = [];
            document.querySelectorAll('.video-slide video').forEach(v => videos.push(v));

            // 切换到新视频
            currentIndex = 0;
            const slides = document.querySelectorAll('.video-slide');
            slides.forEach((slide, i) => {
                slide.style.transform = `translateY(${(i - currentIndex) * 100}%)`;
            });
            updateVideoInfo(0);
            playVideo(0);

            showToast('✅ 视频发布成功！');
        }

        // ========== 启动 ==========
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
